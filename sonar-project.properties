# Identity and connection settings are supplied explicitly through scripts/sonar-scan.mjs.
# Never commit tokens, connection IDs, or deployment-specific server/project values.
sonar.projectName=PulseOps
sonar.sourceEncoding=UTF-8

# Include the shell, both remotes, shared code, federation configuration, and tooling.
sonar.sources=mfe-shell,mfe-orders,mfe-inventory,shared,scripts
sonar.tests=mfe-shell,mfe-orders,mfe-inventory,shared,e2e,scripts
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.mjs,**/*.spec.mjs,e2e/**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/coverage/**,**/test-results/**,**/playwright-report/**,**/*.test.ts,**/*.spec.ts,**/*.test.mjs,**/*.spec.mjs

# Sonar imports coverage; it does not execute tests or create this report.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json,mfe-shell/tsconfig.app.json,mfe-orders/tsconfig.app.json,mfe-inventory/tsconfig.app.json

# An explicitly enabled scan must fail if the server-side quality gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
